<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Information - Cybersecurity News Tracker</title>
    <link rel="stylesheet" href="lul.css">
    <script src="Scripts/check-theme.js" defer></script>
    <script src="Scripts/theme-toggle.js" defer></script>
    <script src="Scripts/fetch-news.js" defer></script>
    <script src="Scripts/login-dropdown.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="IWeakness.png" alt="Home">
        </a>
        <nav style="margin-left:auto;">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <button id="loginBtn" class="login-btn nav-login-btn">Login</button>
        </nav>
    </header>
    <main>
    <img src="About_me.jpg" alt="About Us" style="height:120px;width:100%;object-fit:cover;object-position:center;display:block;margin:16px auto;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <h2 id="newsTitle" style="color:#4a90e2; margin: 0;">Cybersecurity News</h2>
            <div class="searchbar-container" style="display: flex; align-items: center;">
                <input type="text" class="searchbar-input" id="searchInput" placeholder="Search..." style="margin-right: 8px; padding: 6px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 1em; width: 180px;">
                <button class="searchbar-btn" id="searchBtn" style="font-size: 1em; padding: 6px 18px; border-radius: 20px; background: #1976d2; color: #fff; border: none; cursor: pointer;">Search</button>
            </div>
            </div>
            <div id="newsContainer" class="news-scroll-box"></div>
    </main>
    <button class="theme-toggle bottom-right" id="themeToggle">Dark Theme</button>
    <footer>
        <p>&copy; 2025 Your Website Name. All rights reserved.</p>
    </footer>
    <div id="loginDropdown" class="login-dropdown" style="display:none; position:absolute; right:30px; top:80px;">
        <label for="loginName">Username:</label>
        <input type="text" id="loginName" name="loginName" placeholder="Username">
        <label for="loginPassword">Password:</label>
        <input type="password" id="loginPassword" name="loginPassword" placeholder="Password">
        <a href="#" class="login-link">Create an account or forgot password</a>
    </div>
</body>
</html>
